    <div class="container">

        <!-- Login Form -->
        <div class="form-box login">
            <form id="loginForm" onsubmit="handleLoginSubmit(event)" aria-label="Login form">
                <h1>تسجيل الدخول</h1>

                <div class="input-box">
                    <label for="email">البريد الإلكتروني</label>
                    <input id="email" name="email" type="email" placeholder="البريد الإلكتروني" required />
                </div>

                <div class="input-box">
                    <label for="password">كلمة المرور</label>
                    <input id="password" name="password" type="password" placeholder="كلمة المرور" required />
                </div>

                <button type="submit" class="btn">تسجيل الدخول</button>

                <div id="loginError" style="color: red; margin-top: 10px; text-align: center; display: none;"></div>
            </form>
        </div>

        <!-- Register Form -->
        <div class="form-box register">
            <form action="save_signup.php" method="post" onsubmit="return validateForm()" aria-label="Sign-up form">
                <h1>إنشاء حساب</h1>

                <div class="input-box">
                    <label for="username">اسم المستخدم</label>
                    <input id="username" name="username" type="text" placeholder="اسم المستخدم" required />
                </div>

                <div class="input-box">
                    <label for="email">البريد الإلكتروني</label>
                    <input id="email" name="email" type="email" placeholder="البريد الإلكتروني" required />
                </div>

                <div class="input-box">
                    <label for="password">كلمة المرور</label>
                    <input id="password" name="password" type="password" placeholder="كلمة المرور" required />
                </div>

                <button type="submit" class="btn">تسجيل</button>
            </form>
        </div>

        <!-- Toggle Panel -->
        <div class="toggle-box">

            <div class="toggle-panel toggle-left">
                <h1>مرحباً بك!</h1>
                <p>ليس لديك حساب؟</p>
                <button class="btn register-btn">إنشاء حساب</button>
            </div>

            <div class="toggle-panel toggle-right">
                <h1>مرحباً بعودتك!</h1>
                <p>هل لديك حساب مسبقاً؟</p>
                <button class="btn login-btn">تسجيل الدخول</button>
            </div>

        </div>

    </div>
